name: C++ CI

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Check compiler
              run: g++ --version

            - name: Build application
              run: g++ main.cpp -o app

            - name: Run application
              run: ./app